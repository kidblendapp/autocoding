name: AI Teammate

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Path to config'
        required: true
      encoded_config:
        description: 'Encoded or JSON Agent Config'
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  cursor-agent:
    runs-on: ubuntu-latest
    concurrency:
      group: cursor-agent-${{ inputs.config_file }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'

      - name: Install Cursor CLI
        run: |
          echo "Installing Cursor CLI..."
          curl https://cursor.com/install -fsS | bash
          
          echo "Checking installation locations..."
          ls -la "$HOME/.cursor/" || echo "No .cursor directory"
          ls -la "$HOME/.cursor/bin/" || echo "No .cursor/bin directory"
          ls -la "$HOME/.local/bin/" || echo "No .local/bin directory"
          
          # Cursor CLI installs to ~/.local/bin, not ~/.cursor/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
          # Test installation
          export PATH="$HOME/.local/bin:$PATH"
          if command -v cursor-agent; then
            echo "✅ cursor-agent found at: $(command -v cursor-agent)"
            cursor-agent --version 2>&1 || echo "Version check failed"
          else
            echo "❌ cursor-agent not found after installation"
            echo "Available files in .local/bin:"
            ls -la "$HOME/.local/bin/" 2>/dev/null || echo "Directory does not exist"
          fi

      - name: Install DMTools CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/IstiN/dmtools/main/install.sh | bash
          echo "$HOME/.dmtools/bin" >> $GITHUB_PATH

      - name: Build and Install DMTools CLI from source
        run: |
          dmtools || echo "dmtools version failed"
          cursor-agent --version || echo "cursor-agent version failed"
  
      - name: Make scripts executable
        run: |
          chmod +x cicd/scripts/*.sh
          chmod +x agents/js/*.js || true
          ls -la cicd/scripts/ || echo "Scripts directory not found"

      - name: Run AI Teammate
        env:
          DEFAULT_LLM: "dial"
          CURSOR_DEFAULT_MODEL: "auto"
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MODEL: "auto"
          AGENT_DISABLE_WATCHDOG: "1"
          PATH: "/home/runner/.local/bin:/home/runner/.dmtools/bin:/bin:/usr/bin:$PATH"
          # Jira Configuration
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_PATH: ${{ vars.JIRA_BASE_PATH }}
          JIRA_AUTH_TYPE: ${{ vars.JIRA_AUTH_TYPE }}

          # Confluence Configuration
          CONFLUENCE_EMAIL: ${{ secrets.JIRA_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_BASE_PATH: ${{ vars.CONFLUENCE_BASE_PATH }}
          CONFLUENCE_DEFAULT_SPACE: ${{ vars.CONFLUENCE_DEFAULT_SPACE }}
          CONFLUENCE_GRAPHQL_PATH: ${{ vars.CONFLUENCE_GRAPHQL_PATH }}
          JIRA_CLEAR_CACHE: "true"
          # DMTools Integration Settings
          DMTOOLS_INTEGRATIONS: "jira,confluence,figma,ai,cli,file"

          # AI Service Configuration
          # Note: DEFAULT_LLM removed - dmtools will use cursor-agent via cliCommands in agent config
          # GEMINI_API_KEY is optional when using cursor-agent via cliCommands
          #GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Figma Configuration
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_BASE_PATH: ${{ vars.FIGMA_BASE_PATH }}
          ENCODED_CONFIG: ${{ inputs.encoded_config }}

          # GitHub Authentication for PR creation
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

        run: |
          echo "Using configuration: ${{ inputs.config_file }}"
          
          # Note: dmtools may try to initialize AI components for internal use even when skipAIProcessing=true
          # If GEMINI_API_KEY is not set, it will fall back to DIAL, which is fine
          # The actual AI processing uses cursor-agent via cliCommands in the agent config
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "⚠️ GEMINI_API_KEY not set - dmtools will use DIAL for internal operations"
            echo "⚠️ This is fine - cursor-agent will be used via cliCommands for actual AI processing"
          fi
          
          if [ -n "${ENCODED_CONFIG}" ]; then
            echo "Encoded config received (base64)"
            # Decode base64 encoded config to a temporary file to avoid shell quoting issues
            TEMP_CONFIG=$(mktemp)
            echo "${ENCODED_CONFIG}" | base64 -d > "${TEMP_CONFIG}"
            echo "Decoded config preview (first 200 chars):"
            head -c 200 "${TEMP_CONFIG}"
            echo "..."
            # Validate JSON with jq to ensure it's properly formatted
            if ! jq empty "${TEMP_CONFIG}" 2>/dev/null; then
              echo "❌ Error: Decoded config is not valid JSON"
              rm -f "${TEMP_CONFIG}"
              exit 1
            fi
            # Use Python to safely read the file and pass it as an argument without shell expansion
            # This avoids all shell quoting issues with special characters in JSON
            export CONFIG_FILE="${{ inputs.config_file }}"
            export TEMP_CONFIG
            python3 << 'PYTHON_SCRIPT'
import sys
import subprocess
import json
import os

config_file = os.environ['CONFIG_FILE']
temp_config = os.environ['TEMP_CONFIG']

with open(temp_config, 'r') as f:
    config_content = f.read()

# Validate JSON
json.loads(config_content)

# Execute dmtools with the config as argument
subprocess.run(['dmtools', 'run', config_file, config_content], check=True)
PYTHON_SCRIPT
            rm -f "${TEMP_CONFIG}"
          else
            echo "No encoded config provided."
            dmtools run "${{ inputs.config_file }}"
          fi
