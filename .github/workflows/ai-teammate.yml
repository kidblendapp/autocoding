name: AI Teammate

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Path to config'
        required: true
      ticket_key:
        description: 'JIRA ticket key (e.g. AP-51). Used to build encoded config if encoded_config is empty.'
        required: false
      encoded_config:
        description: 'Base64-encoded agent config JSON (e.g. {"params":{"inputJql":"key = AP-51"}}). Prefer ticket_key for a single ticket.'
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: read
  
jobs:
  cursor-agent:
    runs-on: ubuntu-latest
    concurrency:
      group: cursor-agent-${{ inputs.config_file }}
      cancel-in-progress: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java Environment
      uses: ./.github/actions/setup-java-only
      with:
        cache-key-suffix: '-cursor'

    - name: Install Cursor CLI
      run: |
        echo "Installing Cursor CLI..."
        curl https://cursor.com/install -fsS | bash
        
        echo "Checking installation locations..."
        ls -la "$HOME/.cursor/" || echo "No .cursor directory"
        ls -la "$HOME/.cursor/bin/" || echo "No .cursor/bin directory"
        ls -la "$HOME/.local/bin/" || echo "No .local/bin directory"
        
        # Cursor CLI installs to ~/.local/bin, not ~/.cursor/bin
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
        # Test installation
        export PATH="$HOME/.local/bin:$PATH"
        if command -v cursor-agent; then
          echo "✅ cursor-agent found at: $(command -v cursor-agent)"
          cursor-agent --version 2>&1 || echo "Version check failed"
        else
          echo "❌ cursor-agent not found after installation"
          echo "Available files in .local/bin:"
          ls -la "$HOME/.local/bin/" 2>/dev/null || echo "Directory does not exist"
        fi

    - name: Install DMTools CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/IstiN/dmtools/main/install.sh | bash
        echo "$HOME/.dmtools/bin" >> $GITHUB_PATH

    - name: Build and Install DMTools CLI from source
      run: |
        dmtools || echo "dmtools version failed"
        cursor-agent --version || echo "cursor-agent version failed"

    - name: Run AI Teammate
      env:
        CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        MODEL: sonnet-4
        AGENT_DISABLE_WATCHDOG: "1"
        PATH: "/home/runner/.local/bin:/home/runner/.dmtools/bin:/bin:/usr/bin:$PATH"
        # Jira Configuration
        JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
        JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        JIRA_BASE_PATH: ${{ vars.JIRA_BASE_PATH }}
        JIRA_AUTH_TYPE: ${{ vars.JIRA_AUTH_TYPE }}
        JIRA_CLEAR_CACHE: ${{ vars.JIRA_CLEAR_CACHE }}
        JIRA_EXTRA_FIELDS: ${{ vars.JIRA_EXTRA_FIELDS }}
        JIRA_EXTRA_FIELDS_PROJECT: ${{ vars.JIRA_EXTRA_FIELDS_PROJECT }}
        JIRA_LOGGING_ENABLED: ${{ vars.JIRA_LOGGING_ENABLED }}
        JIRA_WAIT_BEFORE_PERFORM: ${{ vars.JIRA_WAIT_BEFORE_PERFORM }}

        # Confluence Configuration
        CONFLUENCE_EMAIL: ${{ secrets.JIRA_EMAIL }}
        CONFLUENCE_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        CONFLUENCE_BASE_PATH: ${{ vars.CONFLUENCE_BASE_PATH }}
        CONFLUENCE_DEFAULT_SPACE: ${{ vars.CONFLUENCE_DEFAULT_SPACE }}
        CONFLUENCE_GRAPHQL_PATH: ${{ vars.CONFLUENCE_GRAPHQL_PATH }}

        # Azure DevOps Configuration
        ADO_PAT_TOKEN: ${{ secrets.ADO_PAT_TOKEN }}
        ADO_ORGANIZATION: ${{ vars.ADO_ORGANIZATION }}
        ADO_PROJECT: ${{ vars.ADO_PROJECT }}
        ADO_BASE_PATH: ${{ vars.ADO_BASE_PATH }}

        # DMTools Integration Settings
        DMTOOLS_INTEGRATIONS: "jira,confluence,figma,ai,cli,file,ado"

        # AI Service Configuration
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_DEFAULT_MODEL: ${{ vars.GEMINI_DEFAULT_MODEL }}
        PROMPT_CHUNK_TOKEN_LIMIT: ${{ vars.PROMPT_CHUNK_TOKEN_LIMIT }}
        
        # Figma Configuration
        FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        FIGMA_BASE_PATH: ${{ vars.FIGMA_BASE_PATH }}
        ENCODED_CONFIG: ${{ inputs.encoded_config }}
        TICKET_KEY: ${{ inputs.ticket_key }}

        # GitHub Authentication for PR creation
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}

      run: |
        echo "Using configuration: ${{ inputs.config_file }}"
        CI_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "CI run URL: ${CI_RUN_URL}"

        # Build encoded config: prefer explicit encoded_config; else build from ticket_key to avoid JSON truncation in workflow inputs
        if [ -n "${ENCODED_CONFIG}" ]; then
          # If value looks like raw JSON (starts with {), base64-encode it so dmtools receives valid input
          case "${ENCODED_CONFIG}" in
            \{*)
              echo "Encoded config looks like raw JSON; base64-encoding for dmtools..."
              ENCODED_CONFIG="$(echo -n "${ENCODED_CONFIG}" | base64 -w 0)"
              ;;
          esac
          echo "Encoded config received (base64 length): $(echo -n "${ENCODED_CONFIG}" | wc -c)"
        fi
        if [ -z "${ENCODED_CONFIG}" ] && [ -n "${TICKET_KEY}" ]; then
          echo "Building encoded config from ticket_key: ${TICKET_KEY}"
          JSON_CONFIG="{\"params\":{\"inputJql\":\"key = ${TICKET_KEY}\"}}"
          ENCODED_CONFIG="$(echo -n "${JSON_CONFIG}" | base64 -w 0)"
        fi

        if [ -n "${ENCODED_CONFIG}" ]; then
          dmtools run "${{ inputs.config_file }}" "${ENCODED_CONFIG}" --ciRunUrl "${CI_RUN_URL}"
        else
          echo "No encoded config or ticket_key provided."
          dmtools run "${{ inputs.config_file }}" --ciRunUrl "${CI_RUN_URL}"
        fi
