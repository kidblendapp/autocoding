name: Jira Ticket Scheduler

on:
  schedule:
    # Запускается каждые 5 минут
    - cron: '*/2 * * * *'
  workflow_dispatch:  # Для ручного запуска

permissions:
  actions: write
  contents: read

jobs:
  fetch-and-trigger:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'

      - name: Install DMTools CLI
        run: |
          curl -fsSL https://github.com/IstiN/dmtools/releases/latest/download/install.sh | bash
          echo "$HOME/.dmtools/bin" >> $GITHUB_PATH

      - name: Fetch Jira tickets and trigger workflows
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_PATH: ${{ vars.JIRA_BASE_PATH }}
          JIRA_AUTH_TYPE: ${{ vars.JIRA_AUTH_TYPE }}
          DMTOOLS_INTEGRATIONS: "jira"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get list of tickets via JQL query
          # Search for tickets with any of the AI processing labels
          JQL_QUERY='project = AP AND type = Story'
          
          # Use dmtools to get tickets with labels field included
          TICKETS_JSON=$(dmtools jira_search_by_jql "$JQL_QUERY" "key,labels")
          
          # Extract ticket keys and labels from JSON response
          TICKET_COUNT=$(echo "$TICKETS_JSON" | jq -r '.issues | length')
          
          if [ "$TICKET_COUNT" -eq 0 ] || [ "$TICKET_COUNT" = "null" ]; then
            echo "No tickets found matching JQL: $JQL_QUERY"
            exit 0
          fi
          
          echo "Found $TICKET_COUNT ticket(s)"
          
          # Track processed tickets to ensure each ticket is processed only once per run
          PROCESSED_TICKETS=()
          
          # Process each ticket - use process substitution to avoid subshell issues
          # IMPORTANT: Each ticket is processed exactly once, even if it has multiple AI labels
          # The first matching label in priority order is selected and processed
          while IFS= read -r TICKET_JSON; do
            TICKET_KEY=$(echo "$TICKET_JSON" | jq -r '.key')
            
            if [ -z "$TICKET_KEY" ] || [ "$TICKET_KEY" = "null" ]; then
              continue
            fi
            
            # Check if this ticket has already been processed in this run
            if [[ " ${PROCESSED_TICKETS[@]} " =~ " ${TICKET_KEY} " ]]; then
              echo "⚠️  Ticket $TICKET_KEY already processed in this run, skipping to avoid duplicate processing"
              continue
            fi
            
            # Extract labels as an array
            TICKET_LABELS_JSON=$(echo "$TICKET_JSON" | jq -r '.fields.labels // []')
            TICKET_LABELS_STR=$(echo "$TICKET_LABELS_JSON" | jq -r '.[]' | tr '\n' ' ')
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Processing ticket: $TICKET_KEY (once per run)"
            echo "  All labels: $TICKET_LABELS_STR"
            
            # Find the highest priority label (lowest number) that exists on the ticket
            # Process in sequence: AI_questions -> AI_description -> AI_solution -> AI_development
            # Only the FIRST matching label will be processed, even if ticket has multiple labels
            SELECTED_LABEL=""
            SELECTED_CONFIG=""
            
            # Check labels in priority order - stops at first match
            if echo "$TICKET_LABELS_JSON" | jq -e 'index("AI_questions") != null' > /dev/null 2>&1; then
              SELECTED_LABEL="AI_questions"
              SELECTED_CONFIG="agents/story_questions.json"
            elif echo "$TICKET_LABELS_JSON" | jq -e 'index("AI_description") != null' > /dev/null 2>&1; then
              SELECTED_LABEL="AI_description"
              SELECTED_CONFIG="agents/story_description.json"
            elif echo "$TICKET_LABELS_JSON" | jq -e 'index("AI_solution") != null' > /dev/null 2>&1; then
              SELECTED_LABEL="AI_solution"
              SELECTED_CONFIG="agents/solution_description.json"
            elif echo "$TICKET_LABELS_JSON" | jq -e 'index("AI_development") != null' > /dev/null 2>&1; then
              SELECTED_LABEL="AI_development"
              SELECTED_CONFIG="agents/story_development.json"
            fi
            
            if [ -z "$SELECTED_LABEL" ]; then
              echo "  ⚠️  No matching AI label found, skipping ticket: $TICKET_KEY"
              continue
            fi
            
            if [ ! -f "$SELECTED_CONFIG" ]; then
              echo "  ❌ Config file not found: $SELECTED_CONFIG"
              continue
            fi
            
            echo "  ✅ Selected label: $SELECTED_LABEL (highest priority)"
            echo "  📄 Using config: $SELECTED_CONFIG"
            echo "  ℹ️  Note: Ticket will be processed once. Other labels (if any) will be processed in future runs after this label is removed."
            
            # Create temporary config file with ticket-specific inputJql
            TEMP_CONFIG=$(mktemp)
            jq --arg ticket "$TICKET_KEY" '.params.inputJql = "key = \($ticket)"' \
              "$SELECTED_CONFIG" > "$TEMP_CONFIG"
            
            # Encode the config as compact JSON for encoded_config input
            ENCODED_CONFIG=$(jq -c . "$TEMP_CONFIG")
            
            # Trigger the workflow with encoded config
            gh workflow run ai-teammate.yml \
              -f config_file="$SELECTED_CONFIG" \
              -f encoded_config="$ENCODED_CONFIG"
            
            # Clean up temp config
            rm -f "$TEMP_CONFIG"
            
            # Mark ticket as processed to prevent duplicate processing in this run
            PROCESSED_TICKETS+=("$TICKET_KEY")
            
            echo "  ✅ Triggered workflow for ticket: $TICKET_KEY with label: $SELECTED_LABEL"
            echo "  ✅ Ticket marked as processed in this run"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Small delay between triggers to avoid rate limiting
            sleep 2
          done < <(echo "$TICKETS_JSON" | jq -c '.issues[]')
          
          echo ""
          echo "Summary: Processed ${#PROCESSED_TICKETS[@]} unique ticket(s) in this run"
          if [ ${#PROCESSED_TICKETS[@]} -gt 0 ]; then
            echo "Processed tickets: ${PROCESSED_TICKETS[*]}"
          fi
