name: Full Test Suite

on:
  workflow_dispatch:
    inputs:
      include_e2e:
        description: 'Include E2E tests'
        required: false
        default: 'true'
        type: boolean

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit
      - name: Test Summary
        if: always()
        run: |
          echo "## Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration
      - name: Test Summary
        if: always()
        run: |
          echo "## Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  smoke:
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: |
          npm run ui:server &
          sleep 5
        env:
          PORT: 3001
      - run: npm run test:smoke
        env:
          API_URL: http://localhost:3001
      - name: Test Summary
        if: always()
        run: |
          echo "## Smoke Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  e2e:
    runs-on: ubuntu-latest
    needs: [smoke]
    if: ${{ github.event.inputs.include_e2e != 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: cd ui && npm ci
      - run: npm run build
      - run: cd ui && npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Start servers
        run: |
          npm run ui:server &
          cd ui && npm run preview &
          sleep 10
        env:
          PORT: 3001
      - run: npm run test:e2e
        env:
          BASE_URL: http://localhost:4173
          API_URL: http://localhost:3001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Test Summary
        if: always()
        run: |
          echo "## E2E Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
